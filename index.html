<!DOCTYPE html>
<html lang="vi" data-theme="sakura">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>SubelJapan — Học tiếng Nhật dễ như ăn mochi</title>
  <meta name="description" content="SubelJapan — web học đọc & viết tiếng Nhật cho người mới bắt đầu từ con số 0: Hiragana, Katakana, Kanji, từ vựng, ngữ pháp, luyện viết có chấm điểm, trò chơi và ôn tập thông minh.">
  <meta name="theme-color" content="#fbf4e8">
  <meta property="og:title" content="SubelJapan — Học tiếng Nhật dễ như ăn mochi">
  <meta property="og:description" content="Học Hiragana, Katakana, Kanji qua bài học siêu ngắn, luyện viết có chấm điểm, 6 trò chơi và luyện tập vô tận.">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Klee+One:wght@400;600&family=Mali:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=2">
</head>
<body>
  <!-- Bộ lọc "nét bút tay" dùng chung cho mọi hình vẽ -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <defs>
      <filter id="sj-rough" x="-10%" y="-10%" width="120%" height="120%">
        <feTurbulence type="fractalNoise" baseFrequency="0.045" numOctaves="2" seed="7" result="n"/>
        <feDisplacementMap in="SourceGraphic" in2="n" scale="1.7" xChannelSelector="R" yChannelSelector="G"/>
      </filter>
      <filter id="sj-paper"><feTurbulence type="fractalNoise" baseFrequency=".8" numOctaves="3" stitchTiles="stitch"/><feColorMatrix values="0 0 0 0 .45  0 0 0 0 .38  0 0 0 0 .3  0 0 0 .07 0"/></filter>
    </defs>
  </svg>
  <div id="petals" aria-hidden="true"></div>

  <header class="topbar">
    <div class="topbar-in">
      <a href="#/" class="brand" id="brand" aria-label="SubelJapan - Trang chủ">
        <span class="brand-logo"><svg viewBox="0 0 40 40" width="40" height="40"><g filter="url(#sj-rough)"><path d="M7 16 L9 4 L17 10 Z M33 16 L31 4 L23 10 Z" fill="#fffaf2" stroke="#3d3142" stroke-width="2.2" stroke-linejoin="round"/><ellipse cx="20" cy="22" rx="16" ry="14" fill="#fffaf2" stroke="#3d3142" stroke-width="2.4"/><path d="M5 17 Q20 9 35 17 L34.6 21 Q20 14 5.4 21 Z" fill="#ef6f86" stroke="#3d3142" stroke-width="1.6"/><circle cx="20" cy="14.6" r="2.4" fill="#e9675d" stroke="#3d3142" stroke-width="1.2"/><path d="M12 24 q2.5 -3 5 0 M23 24 q2.5 -3 5 0" fill="none" stroke="#3d3142" stroke-width="2" stroke-linecap="round"/><ellipse cx="10.5" cy="28" rx="3" ry="2" fill="#f9b8c6"/><ellipse cx="29.5" cy="28" rx="3" ry="2" fill="#f9b8c6"/><path d="M17 29 q1.5 2 3 0 q1.5 2 3 0" fill="none" stroke="#3d3142" stroke-width="1.6" stroke-linecap="round"/></g></svg></span>
        <span class="brand-name">Subel<b>Japan</b></span>
      </a>
      <nav class="nav" id="nav" aria-label="Điều hướng chính"></nav>
      <div class="top-stats" id="top-stats"></div>
    </div>
  </header>

  <main id="view" class="view"></main>

  <nav class="bottombar" id="bottombar" aria-label="Điều hướng"></nav>
  <div id="toast-root" aria-live="polite"></div>

  <noscript><div style="padding:40px;text-align:center;font-family:sans-serif">SubelJapan cần bật JavaScript để chạy nha.</div></noscript>

  <script src="js/icons.js?v=2"></script>
  <script src="js/data-kana.js?v=2"></script>
  <script src="js/data-content.js?v=2"></script>
  <script src="js/data-lessons.js?v=2"></script>
  <script src="js/store.js?v=2"></script>
  <script src="js/audio.js?v=2"></script>
  <script src="js/ui.js?v=2"></script>
  <script src="js/writing.js?v=2"></script>
  <script src="js/lesson.js?v=2"></script>
  <script src="js/games.js?v=2"></script>
  <script src="js/practice.js?v=2"></script>
  <script src="js/pages.js?v=2"></script>
  <script src="js/app.js?v=2"></script>
</body>
</html>
